<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generation Log &mdash; Token Vault Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
</head>
<body>

<div class="banner">
  <h1>Generation Log</h1>
  <p class="subtitle">Admin only &mdash; prompts behind every generated token</p>
  <div class="divider" aria-hidden="true">&#10038;</div>
</div>

<main class="generator-main">
  <form id="admin-auth-form" class="generator-form">
    <div class="generator-field">
      <label for="admin-key" class="generator-label">Admin key</label>
      <input
        type="password"
        id="admin-key"
        class="generator-select"
        autocomplete="off"
        placeholder="Paste the admin API key"
      >
    </div>
    <button type="submit" class="page-btn generator-submit" id="admin-load-btn">Load Log</button>
  </form>

  <p id="admin-status" class="generator-status" aria-live="polite"></p>

  <section id="admin-log" class="admin-log" aria-label="Generation log"></section>
</main>

<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
