<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Vault Index &mdash; Token Vault Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
</head>
<body>

<div class="banner">
  <h1>Full Vault Index</h1>
  <p class="subtitle">Admin only &mdash; every token in the catalog, across every style</p>
  <div class="divider" aria-hidden="true">&#10038;</div>
  <nav class="site-nav">
    <a href="admin.html">&laquo; Back to Admin</a>
  </nav>
</div>

<main>
  <section id="admin-vault-gate">
    <form id="admin-vault-auth-form" class="generator-form">
      <div class="generator-field">
        <label for="admin-vault-key" class="generator-label">Admin key</label>
        <input
          type="password"
          id="admin-vault-key"
          class="generator-select"
          autocomplete="off"
          placeholder="Paste the admin API key"
        >
      </div>
      <button type="submit" class="page-btn generator-submit" id="admin-vault-unlock-btn">Unlock</button>
    </form>

    <p id="admin-vault-status" class="generator-status" aria-live="polite"></p>
  </section>

  <div id="admin-vault-content" hidden>
    <div class="search-wrap">
      <select id="style-select" class="style-select" aria-label="Token art style">
        <!-- Style options are rendered here by admin-vault.js -->
      </select>
      <select id="category-select" class="style-select" aria-label="Monster category">
        <!-- Category options are rendered here by admin-vault.js -->
      </select>
      <input
        type="search"
        id="token-search"
        class="token-search"
        placeholder="Search tokens by name or tag..."
        aria-label="Search tokens by name or tag"
        autocomplete="off"
      >
    </div>

    <section id="token-grid" class="token-grid" aria-label="Available tokens">
      <!-- Token cards are rendered here by admin-vault.js -->
    </section>

    <nav id="pagination" class="pagination" aria-label="Token page navigation">
      <!-- Pagination controls are rendered here by admin-vault.js -->
    </nav>
  </div>
</main>

<dialog id="token-modal" class="token-modal">
  <form method="dialog" class="token-modal-form">
    <button type="submit" class="token-modal-close" aria-label="Close">&times;</button>
    <h2 id="token-modal-title" class="token-modal-title">Token Name</h2>

    <div class="token-modal-body">
      <div class="token-preview-col">
        <div class="token-preview-wrap">
          <canvas id="token-preview-canvas" width="1024" height="1024"></canvas>
        </div>
        <p class="token-position-hint">Drag the token to reposition it</p>
      </div>

      <div class="token-modal-controls">
        <fieldset class="token-control-group">
          <legend class="generator-label">Position &amp; Zoom</legend>
          <div class="token-subcontrol">
            <label for="zoom-range" class="token-subcontrol-label">Zoom</label>
            <input type="range" id="zoom-range" min="50" max="300" step="5" value="100">
          </div>
          <div class="token-modal-actions">
            <button type="button" id="reset-position-btn" class="page-btn">Reset Position</button>
          </div>
        </fieldset>

        <fieldset class="token-control-group">
          <legend class="generator-label">
            <label class="token-toggle">
              <input type="checkbox" id="border-toggle">
              Add border
            </label>
          </legend>
          <div class="token-subcontrol">
            <label for="border-color" class="token-subcontrol-label">Color</label>
            <input type="color" id="border-color" value="#c9a227">
          </div>
          <div class="token-subcontrol">
            <label for="border-width" class="token-subcontrol-label">Width</label>
            <input type="range" id="border-width" min="1" max="12" step="1" value="5">
          </div>
        </fieldset>

        <fieldset class="token-control-group">
          <legend class="generator-label">Shape</legend>
          <div class="shape-options" id="shape-options" role="radiogroup" aria-label="Border shape">
            <button type="button" class="shape-btn" data-shape="circle">Circle</button>
            <button type="button" class="shape-btn" data-shape="square">Square</button>
            <button type="button" class="shape-btn" data-shape="hexagon">Hexagon</button>
          </div>
        </fieldset>

        <fieldset class="token-control-group">
          <legend class="generator-label">
            <label class="token-toggle">
              <input type="checkbox" id="tint-toggle">
              Add background tint
            </label>
          </legend>
          <div class="token-subcontrol">
            <label for="tint-color" class="token-subcontrol-label">Color</label>
            <input type="color" id="tint-color" value="#241609">
          </div>
        </fieldset>

        <div class="token-modal-actions">
          <button type="button" id="token-download-btn" class="page-btn">Download</button>
        </div>
        <p id="token-modal-status" class="generator-status" aria-live="polite"></p>
      </div>
    </div>
  </form>
</dialog>

<script src="js/config.js"></script>
<script src="js/vault-data.js"></script>
<script src="js/admin-vault.js"></script>
<script src="js/token-customize.js"></script>
</body>
</html>
