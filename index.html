<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Vault &mdash; D&amp;D Token Downloads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="banner">
  <h1>&#9876;&#65039; The Token Vault &#9876;&#65039;</h1>
  <p class="subtitle">Click a token to claim it for your table</p>
  <div class="divider" aria-hidden="true">&#10038;</div>
</div>

<main>
  <div class="search-wrap">
    <input
      type="search"
      id="token-search"
      class="token-search"
      placeholder="Search tokens by name..."
      aria-label="Search tokens by name"
      autocomplete="off"
    >
  </div>

  <section id="token-grid" class="token-grid" aria-label="Available tokens">
    <!-- Token cards are rendered here by app.js -->
  </section>

  <nav id="pagination" class="pagination" aria-label="Token page navigation">
    <!-- Pagination controls are rendered here by app.js -->
  </nav>
</main>

<footer>
  <p>May your rolls be ever in your favor.</p>
</footer>

<script src="config.js"></script>
<script src="tokens.js"></script>
<script src="app.js"></script>
</body>
</html>
