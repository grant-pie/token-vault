name = "token-vault-generator"
main = "src/index.js"
compatibility_date = "2026-07-22"

[[r2_buckets]]
binding = "TOKEN_BUCKET"
bucket_name = "token-vault-images"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "b3048eab0cb74a578258d4312422cf14"

[[kv_namespaces]]
binding = "FEEDBACK"
id = "f38ecc82f4774b15a48bdb38bbb19398"

[[kv_namespaces]]
binding = "ANALYTICS"
id = "c64eeed4623545708a89b10bb9a2315c"

# Credit ledger for the paid-generation system (see CREDIT_SYSTEM_PLAN.md).
# Already created; database_id below is real, not a placeholder.
[[d1_databases]]
binding = "CREDITS_DB"
database_name = "token-vault-credits"
database_id = "de07e400-f506-4980-8fad-5e59e084cd0b"

[observability]
enabled = true

[vars]
# ADMIN_EMAIL (where feedback notification emails are sent) is set as a
# secret instead of a var here, via `wrangler secret put ADMIN_EMAIL`.
# Optional: sender identity. Defaults to Resend's shared test
# domain if left unset; use a verified domain in production.
FEEDBACK_FROM_EMAIL = "Token Vault <feedback@grantpieterse.com>"

# RESEND_API_KEY must be set as a secret, not a var:
#   wrangler secret put RESEND_API_KEY

# Where Paystack redirects after a purchase; claim-session runs client-side
# there, reading the ?reference=... Paystack appends automatically.
CHECKOUT_RETURN_URL = "https://grant-pie.github.io/token-vault/generate.html"

# PAYSTACK_SECRET_KEY and TOKEN_SIGNING_SECRET must be set as secrets, not
# vars. Unlike Stripe, Paystack has no separate webhook-signing secret — the
# same secret key both authorizes API calls and signs webhook payloads:
#   wrangler secret put PAYSTACK_SECRET_KEY
#   wrangler secret put TOKEN_SIGNING_SECRET   (already set)

# ADMIN_API_KEY gates GET /api/admin/generation-log (the prompt-inclusive
# admin log behind admin.html). Pick a long random string, not a memorable
# password — it's compared as a bearer token, not typed at a login prompt:
#   wrangler secret put ADMIN_API_KEY
