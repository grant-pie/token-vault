name = "token-vault-generator"
main = "src/index.js"
compatibility_date = "2026-07-22"

[[r2_buckets]]
binding = "TOKEN_BUCKET"
bucket_name = "token-vault-images"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "b3048eab0cb74a578258d4312422cf14"

[[kv_namespaces]]
binding = "FEEDBACK"
id = "f38ecc82f4774b15a48bdb38bbb19398"

[[kv_namespaces]]
binding = "ANALYTICS"
id = "c64eeed4623545708a89b10bb9a2315c"

[observability]
enabled = true

[vars]
# ADMIN_EMAIL (where feedback notification emails are sent) is set as a
# secret instead of a var here, via `wrangler secret put ADMIN_EMAIL`.
# Optional: sender identity. Defaults to Resend's shared test
# domain if left unset; use a verified domain in production.
FEEDBACK_FROM_EMAIL = "Token Vault <feedback@grantpieterse.com>"

# RESEND_API_KEY must be set as a secret, not a var:
#   wrangler secret put RESEND_API_KEY
